name: Premier workflow CI


on:
  push:
  workflow_dispatch:


jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Afficher un message
        run: echo "Hello from GitHub Actions"

      - name: Afficher les informations du runner
        run: |
          echo "1. Version de Python :"
          python3 --version

          echo "2. Répertoire courant :"
          pwd

          echo "3. Liste des fichiers :"
          ls -la
      - name: Informations Git
        run: |
          echo "Branche : $GITHUB_REF_NAME"
          echo "Commit : $GITHUB_SHA"
          echo "Événement : $GITHUB_EVENT_NAME"
      
      - name: Provoquer une erreur
        run: exit 1

      - name: Étape après erreur
        run: echo "Cette étape ne sera normalement pas exécutée"
